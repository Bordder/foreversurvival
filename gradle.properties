# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
#   check these on https://fabricmc.net/develop/
#   26.1+ is shipped unobfuscated with parameter names, so there is no
#   yarn_mappings property any more: the mod is written against Mojang names.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.20

# Mod Properties
mod_version=1.0.0
maven_group=com.foreversurvival
archives_base_name=foreversurvival

# Dependencies
#   Fabric API is the ONLY mod dependency.
fabric_version=0.160.0+26.2

# Loom 1.17 needs a JVM >= 21 to run Gradle itself, which is separate from
# the JDK 25 the mod compiles against. If your JAVA_HOME is older than 21,
# uncomment this and point it at a JDK 21+ install. Forward slashes: this is
# a Java properties file.
#org.gradle.java.home=/path/to/jdk-21-or-newer
