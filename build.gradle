plugins {
	// 26.1+ uses the new non-remapping Loom plugin: Minecraft ships
	// unobfuscated, so there is nothing left to remap.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	// The Minecraft version is in the file name so a 1.18.2 build and a 26.2
	// build cannot overwrite each other in build/libs.
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}
version = project.mod_version
group = project.maven_group

repositories {
	// Loom adds the Fabric and Mojang repositories automatically.
	// No FTB, no CurseMaven, no KubeJS: this mod is fully self-contained.
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// No `mappings` line: 26.1+ is unobfuscated and carries parameter names.
	// Plain `implementation`, not `modImplementation`, for the same reason.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is the ONLY mod dependency.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
	// javac stops at 100 errors by default, which hides whole files during a
	// port and makes "no errors left in X" read as true when it is not.
	it.options.compilerArgs << "-Xmaxerrs" << "10000"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	// Only JDK 17 is installed on the dev machine; let Gradle provision 25
	// itself via the foojay resolver configured in settings.gradle.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
